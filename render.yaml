services:
  - type: web
    name: inventory-chapter3
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --no-dev
    startCommand: uv run --no-dev python main.py
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: '3.12.15'
      - key: UV_PYTHON
        value: '3.12'
