[project]
name = "inventory-solver"
version = "0.1.0"
description = "Evidence-traceable inventory homework solver with a NiceGUI web interface"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "nicegui>=3.14,<4",
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "openpyxl>=3.1,<4",
    "latex2mathml>=3.77,<4",
    "markdown2>=2.5,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Ensure CLI pytest and python -m pytest resolve the local source package identically.
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 105

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
